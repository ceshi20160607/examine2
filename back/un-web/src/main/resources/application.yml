server:
  port: 9999

# 全部业务表以删除时间统一逻辑删除；关联查询及统计仍由业务入口核对过滤范围。
mybatis-plus:
  global-config:
    db-config:
      logic-delete-field: deletedTime
      logic-not-delete-value: 'null'
      logic-delete-value: 'now(3)'

spring:
  # HTTP 日期参数与 JSON 时间采用 ISO 8601；MySQL 连接及带时区的值按同一业务时区处理。
  mvc:
    format:
      date: yyyy-MM-dd
      date-time: yyyy-MM-dd'T'HH:mm:ss
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  datasource:
    url: ${APP_DB_URL:jdbc:mysql://127.0.0.1:3306/unexamine_r16?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${APP_DB_USERNAME:root}
    password: ${APP_DB_PASSWORD:}
  data:
    redis:
      client-type: jedis
      host: ${APP_REDIS_HOST:127.0.0.1}
      port: ${APP_REDIS_PORT:6379}
      password: ${APP_REDIS_PASSWORD:}
