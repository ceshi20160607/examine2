# External runtime configuration for unexamine backend.
# server.sh loads this file with:
# --spring.config.additional-location=optional:file:./

server:
  port: ${UNEXAMINE_SERVER_PORT:9999}
  shutdown: graceful
  servlet:
    context-path: ${UNEXAMINE_CONTEXT_PATH:}

spring:
  application:
    name: unexamine
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}
  lifecycle:
    timeout-per-shutdown-phase: ${UNEXAMINE_SHUTDOWN_TIMEOUT:30s}
  datasource:
    url: ${UNEXAMINE_DB_URL:jdbc:mysql://192.168.0.211:3306/examine2?characterEncoding=utf8&useSSL=false&zeroDateTimeBehavior=convertToNull&tinyInt1isBit=false&serverTimezone=Asia/Shanghai&useAffectedRows=true&allowPublicKeyRetrieval=true}
    username: ${UNEXAMINE_DB_USERNAME:examine}
    password: ${UNEXAMINE_DB_PASSWORD:examine}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${UNEXAMINE_REDIS_HOST:192.168.0.211}
      port: ${UNEXAMINE_REDIS_PORT:6379}
      password: ${UNEXAMINE_REDIS_PASSWORD:123456}
      database: ${UNEXAMINE_REDIS_DATABASE:10}
      timeout: ${UNEXAMINE_REDIS_TIMEOUT:3s}
  servlet:
    multipart:
      max-file-size: ${UNEXAMINE_UPLOAD_MAX_FILE_SIZE:50MB}
      max-request-size: ${UNEXAMINE_UPLOAD_MAX_REQUEST_SIZE:100MB}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

logging:
  file:
    name: ${UNEXAMINE_LOG_FILE:./logs/examine-web.log}
  level:
    root: ${UNEXAMINE_LOG_LEVEL:INFO}
    com.unique.examine: ${UNEXAMINE_APP_LOG_LEVEL:INFO}

unexamine:
  bootstrap:
    platform-root:
      enabled: ${UNEXAMINE_PLATFORM_ROOT_ENABLED:true}
      account-name: ${UNEXAMINE_PLATFORM_ROOT_USERNAME:admin}
      initial-password: ${UNEXAMINE_PLATFORM_ROOT_PASSWORD:123123aa}
      reset-password: ${UNEXAMINE_PLATFORM_ROOT_RESET_PASSWORD:false}
  security:
    cors-allowed-origins: ${UNEXAMINE_CORS_ALLOWED_ORIGINS:}
    allow-account-id-header: ${UNEXAMINE_ALLOW_ACCOUNT_ID_HEADER:false}
    access-token-ttl: ${UNEXAMINE_ACCESS_TOKEN_TTL:2h}
    refresh-token-ttl: ${UNEXAMINE_REFRESH_TOKEN_TTL:7d}
  upload:
    local-root: ${UNEXAMINE_UPLOAD_LOCAL_ROOT:./data/uploads}
  async:
    worker-pool-size: ${UNEXAMINE_ASYNC_WORKER_POOL_SIZE:4}
  ai-agent:
    default-provider: ${UNEXAMINE_AGENT_PROVIDER:LOCAL}
    request-timeout: ${UNEXAMINE_AGENT_REQUEST_TIMEOUT:60s}

# Initialize the database with sql/init.sql before starting a real deployment.
