# Copy this server block into the nginx http context or sites-enabled directory.
# The frontend package must keep frontend/config.js empty for production.
# All application API calls use the same origin path /api/... and are proxied here.

server {
    listen 80;
    server_name unexamine.example.com;

    root /opt/unexamine/frontend;
    index index.html;
    client_max_body_size 100m;

    location = /config.js {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:9999;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
