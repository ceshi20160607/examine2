<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>P19 Codex Open Design Prototype</title>
  <style>
    :root {
      --bg: oklch(98% 0.004 245);
      --surface: oklch(100% 0 0);
      --surface-2: oklch(96.5% 0.006 245);
      --fg: oklch(20% 0.018 245);
      --muted: oklch(52% 0.018 245);
      --border: oklch(90% 0.008 245);
      --accent: oklch(55% 0.16 246);
      --accent-2: oklch(59% 0.12 166);
      --success: oklch(58% 0.13 150);
      --warn: oklch(68% 0.14 72);
      --danger: oklch(56% 0.18 28);
      --info: oklch(60% 0.12 230);
      --font-display: "Microsoft YaHei UI", "PingFang SC", "Segoe UI", system-ui, sans-serif;
      --font-body: "Microsoft YaHei UI", "PingFang SC", "Segoe UI", system-ui, sans-serif;
      --font-mono: "Cascadia Mono", "JetBrains Mono", Consolas, monospace;
      --shadow: 0 10px 30px rgba(20, 32, 54, .10);
      --topbar: 56px;
      --sidebar: 248px;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-body);
      font-size: 14px;
      line-height: 1.55;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    .app { height: 100vh; display: grid; grid-template-rows: var(--topbar) 1fr; }
    .topbar {
      display: grid;
      grid-template-columns: 248px 1fr auto;
      align-items: center;
      gap: 16px;
      height: var(--topbar);
      padding: 0 18px;
      background: rgba(255,255,255,.92);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(12px);
      z-index: 20;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; }
    .brand-mark {
      width: 30px; height: 30px; border-radius: 8px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff; display: grid; place-items: center; font-size: 13px;
      font-family: var(--font-mono);
    }
    .global-search {
      max-width: 560px;
      height: 34px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--muted);
    }
    .global-search input { border: 0; outline: 0; background: transparent; flex: 1; min-width: 180px; }
    .top-actions { display: flex; align-items: center; gap: 8px; }
    .layout { min-height: 0; display: grid; grid-template-columns: var(--sidebar) 1fr; }
    body.collapsed { --sidebar: 72px; }
    .sidebar {
      background: var(--surface);
      border-right: 1px solid var(--border);
      min-width: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .workspace-tabs { padding: 10px; display: grid; gap: 6px; border-bottom: 1px solid var(--border); }
    .workspace-tabs button,
    .nav-item,
    .side-section button {
      border: 0;
      width: 100%;
      text-align: left;
      background: transparent;
      color: var(--fg);
      border-radius: 6px;
      min-height: 36px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
    }
    .workspace-tabs button.active,
    .nav-item.active,
    .side-section button.active {
      background: color-mix(in oklch, var(--accent) 12%, white);
      color: oklch(42% 0.17 246);
      font-weight: 600;
    }
    .workspace-tabs .dot, .nav-ico {
      width: 22px; height: 22px; flex: 0 0 auto;
      border: 1px solid var(--border);
      border-radius: 6px;
      display: grid; place-items: center;
      font: 11px/1 var(--font-mono);
      color: var(--muted);
      background: var(--surface);
    }
    body.collapsed .nav-label, body.collapsed .workspace-label, body.collapsed .side-title, body.collapsed .side-meta { display: none; }
    .side-head { padding: 12px 10px; display: flex; gap: 8px; align-items: center; }
    .ghost-btn, .icon-btn, .btn, .chip, .page-btn {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--fg);
      border-radius: 6px;
      min-height: 32px;
      padding: 0 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
    }
    .icon-btn { width: 34px; padding: 0; }
    .primary { border-color: color-mix(in oklch, var(--accent) 72%, black); background: var(--accent); color: white; }
    .danger { border-color: color-mix(in oklch, var(--danger) 55%, white); color: var(--danger); }
    .side-section { padding: 8px 10px 14px; overflow: auto; }
    .side-title {
      margin: 12px 10px 6px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .08em;
      text-transform: uppercase;
      font-weight: 600;
    }
    .main { min-width: 0; overflow: auto; }
    .screen { display: none; min-height: 100%; padding: 18px; }
    .screen.active { display: block; }
    .page-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 14px;
    }
    .breadcrumb { color: var(--muted); font-size: 13px; margin-bottom: 4px; }
    h1 { margin: 0; font-family: var(--font-display); font-size: 24px; line-height: 1.2; letter-spacing: -0.01em; }
    .sub { color: var(--muted); max-width: 72ch; margin-top: 6px; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .tool-left, .tool-right, .filters, .inline { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .panel, .card, .table-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .panel { padding: 14px; box-shadow: 0 1px 0 rgba(16, 24, 40, .02); }
    .grid { display: grid; gap: 12px; }
    .grid.cols-4 { grid-template-columns: repeat(4, minmax(0,1fr)); }
    .grid.cols-3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
    .grid.cols-2 { grid-template-columns: repeat(2, minmax(0,1fr)); }
    .metric { padding: 14px; min-height: 96px; }
    .metric .label { color: var(--muted); font-size: 13px; }
    .metric .num { margin-top: 8px; font: 600 26px/1.1 var(--font-display); letter-spacing: -0.02em; }
    .metric .hint { margin-top: 8px; color: var(--muted); font-size: 12px; }
    .split { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(360px, .8fr); gap: 12px; }
    .input, .select, .textarea {
      min-height: 32px;
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: 6px;
      padding: 0 10px;
      outline: 0;
      min-width: 150px;
    }
    .textarea { padding: 8px 10px; min-height: 82px; resize: vertical; }
    .chip { color: var(--muted); background: var(--surface-2); min-height: 28px; padding: 0 10px; font-size: 13px; }
    .chip.active { color: oklch(42% 0.17 246); border-color: color-mix(in oklch, var(--accent) 38%, white); background: color-mix(in oklch, var(--accent) 10%, white); }
    .status {
      display: inline-flex; align-items: center; gap: 6px;
      min-height: 22px; padding: 0 8px; border-radius: 999px;
      font-size: 12px; border: 1px solid var(--border);
      background: var(--surface-2); color: var(--muted);
    }
    .status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .ok { color: var(--success); background: color-mix(in oklch, var(--success) 9%, white); }
    .warn { color: var(--warn); background: color-mix(in oklch, var(--warn) 12%, white); }
    .bad { color: var(--danger); background: color-mix(in oklch, var(--danger) 9%, white); }
    .info { color: var(--info); background: color-mix(in oklch, var(--info) 9%, white); }
    table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
    th, td { padding: 10px 12px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: middle; }
    th { color: var(--muted); background: var(--surface-2); font-weight: 600; letter-spacing: .02em; }
    tr:last-child td { border-bottom: 0; }
    tbody tr:hover td { background: oklch(98.2% 0.006 245); }
    .table-card { overflow: hidden; }
    .table-title { padding: 12px 14px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; gap: 10px; align-items: center; }
    .table-scroll { overflow: auto; }
    .actions { display: flex; gap: 6px; justify-content: flex-end; }
    .link-btn { border: 0; background: transparent; color: oklch(42% 0.17 246); padding: 0; min-height: 24px; }
    .pagination { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border-top: 1px solid var(--border); color: var(--muted); }
    .page-btn { min-width: 30px; min-height: 28px; padding: 0 8px; }
    .page-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .drawer-mask, .modal-mask { position: fixed; inset: 0; display: none; z-index: 40; background: rgba(15, 23, 42, .24); }
    .drawer-mask.open, .modal-mask.open { display: block; }
    .drawer {
      position: absolute; right: 0; top: 0; height: 100%; width: min(720px, 96vw);
      background: var(--surface); box-shadow: -18px 0 40px rgba(20,32,54,.18);
      display: grid; grid-template-rows: auto 1fr auto;
    }
    .drawer-head, .drawer-foot { padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .drawer-foot { border-top: 1px solid var(--border); border-bottom: 0; justify-content: flex-end; }
    .drawer-body { padding: 16px 18px; overflow: auto; }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .field { display: grid; gap: 6px; }
    .field label { font-size: 13px; color: var(--muted); }
    .field.full { grid-column: 1 / -1; }
    .form-section { margin-bottom: 18px; }
    .form-section h3 { margin: 0 0 10px; font-size: 15px; letter-spacing: 0; }
    .notice { border: 1px solid color-mix(in oklch, var(--warn) 30%, white); background: color-mix(in oklch, var(--warn) 10%, white); padding: 10px 12px; border-radius: 6px; color: oklch(45% 0.11 72); }
    .modal {
      width: min(440px, calc(100vw - 32px)); background: var(--surface); border-radius: 8px;
      box-shadow: var(--shadow); margin: 12vh auto; border: 1px solid var(--border);
    }
    .modal-head, .modal-body, .modal-foot { padding: 16px; }
    .modal-head { border-bottom: 1px solid var(--border); font-weight: 600; }
    .modal-foot { display: flex; justify-content: flex-end; gap: 8px; border-top: 1px solid var(--border); }
    .toast { position: fixed; right: 22px; bottom: 22px; padding: 10px 14px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); box-shadow: var(--shadow); opacity: 0; transform: translateY(10px); transition: .18s; z-index: 80; }
    .toast.show { opacity: 1; transform: translateY(0); }
    .identity-grid { grid-template-columns: 1fr 1fr; align-items: stretch; }
    .route-card { padding: 16px; display: grid; gap: 12px; }
    .route-card h3 { margin: 0; font-size: 18px; }
    .route-steps { display: grid; gap: 8px; }
    .route-step { display: grid; grid-template-columns: 26px 1fr auto; gap: 10px; align-items: center; padding: 9px; background: var(--surface-2); border-radius: 6px; }
    .step-num { width: 24px; height: 24px; border-radius: 6px; background: var(--fg); color: white; display: grid; place-items: center; font: 12px/1 var(--font-mono); }
    .system-row { display: grid; grid-template-columns: 28px minmax(220px, 1.4fr) 120px 120px 130px 80px 160px; gap: 12px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--border); }
    .system-row.head { color: var(--muted); font-weight: 600; background: var(--surface-2); }
    .fav { color: oklch(65% 0.13 82); font-size: 16px; }
    .progress-list { display: grid; gap: 8px; }
    .progress-line { display: grid; grid-template-columns: 130px 1fr 44px; gap: 10px; align-items: center; }
    .bar { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
    .bar > span { display: block; height: 100%; background: var(--accent-2); }
    .kanban { display: grid; grid-template-columns: 280px 1fr; gap: 12px; }
    .dept-tree { padding: 12px; display: grid; gap: 6px; }
    .tree-node { padding: 8px 10px; border-radius: 6px; }
    .tree-node.active { background: color-mix(in oklch, var(--accent) 10%, white); color: oklch(42% 0.17 246); font-weight: 600; }
    .adv-panel { display: none; margin-bottom: 12px; }
    .adv-panel.open { display: block; }
    .empty-state { padding: 26px; text-align: center; color: var(--muted); }
    .tabs { display: flex; gap: 6px; border-bottom: 1px solid var(--border); padding: 0 12px; }
    .tab { border: 0; background: transparent; padding: 11px 10px; color: var(--muted); border-bottom: 2px solid transparent; }
    .tab.active { color: oklch(42% 0.17 246); border-bottom-color: var(--accent); font-weight: 600; }
    .source-badge { font-size: 12px; color: var(--muted); }
    @media (max-width: 1100px) {
      .grid.cols-4 { grid-template-columns: repeat(2, minmax(0,1fr)); }
      .grid.cols-3, .split, .identity-grid, .kanban { grid-template-columns: 1fr; }
      .layout { grid-template-columns: 72px 1fr; }
      .nav-label, .workspace-label, .side-title, .side-meta { display: none; }
      .topbar { grid-template-columns: 180px 1fr auto; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand"><div class="brand-mark">P19</div><span>P19 Codex Open Design Prototype</span></div>
      <label class="global-search"><span>搜索</span><input id="globalSearch" placeholder="系统、账号、Flow、对外应用、requestId" /></label>
      <div class="top-actions">
        <button class="ghost-btn" data-go="identity">登录分流</button>
        <button class="ghost-btn" data-go="systems">系统选择中心</button>
        <button class="icon-btn" id="collapseBtn" title="折叠导航">≡</button>
        <button class="ghost-btn">王管理员</button>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <div class="workspace-tabs" id="workspaceTabs">
          <button class="active" data-workspace="platform"><span class="dot">P</span><span class="workspace-label">平台管理</span></button>
          <button data-workspace="system"><span class="dot">S</span><span class="workspace-label">系统管理</span></button>
          <button data-workspace="runtime"><span class="dot">R</span><span class="workspace-label">系统运行台</span></button>
        </div>
        <div class="side-head">
          <button class="ghost-btn" data-go="systems"><span class="nav-ico">切</span><span class="nav-label">切换系统</span></button>
        </div>
        <div class="side-section" id="navList"></div>
      </aside>

      <main class="main" id="main">
        <section class="screen active" id="identity"></section>
        <section class="screen" id="systems"></section>
        <section class="screen" id="create-system"></section>
        <section class="screen" id="platform-overview"></section>
        <section class="screen" id="platform-accounts"></section>
        <section class="screen" id="platform-flow"></section>
        <section class="screen" id="platform-apps"></section>
        <section class="screen" id="platform-logs"></section>
        <section class="screen" id="platform-audits"></section>
        <section class="screen" id="system-overview"></section>
        <section class="screen" id="system-members"></section>
        <section class="screen" id="system-modules"></section>
        <section class="screen" id="system-pages"></section>
        <section class="screen" id="system-app-configs"></section>
        <section class="screen" id="system-flow-bindings"></section>
        <section class="screen" id="system-logs"></section>
        <section class="screen" id="system-audits"></section>
        <section class="screen" id="runtime-home"></section>
        <section class="screen" id="runtime-data"></section>
      </main>
    </div>
  </div>

  <div class="drawer-mask" id="drawerMask">
    <aside class="drawer" role="dialog" aria-modal="true">
      <div class="drawer-head"><div><strong id="drawerTitle">详情</strong><div class="source-badge" id="drawerSub">右侧抽屉</div></div><button class="icon-btn" id="drawerClose">×</button></div>
      <div class="drawer-body" id="drawerBody"></div>
      <div class="drawer-foot"><button class="ghost-btn" id="drawerCancel">取消</button><button class="btn primary" id="drawerSave">保存</button></div>
    </aside>
  </div>

  <div class="modal-mask" id="modalMask">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head" id="modalTitle">危险操作确认</div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-foot"><button class="ghost-btn" id="modalCancel">取消</button><button class="btn danger" id="modalConfirm">确认停用</button></div>
    </div>
  </div>
  <div class="toast" id="toast">保存成功</div>

  <script>
    const navs = {
      platform: [
        ["platform-overview", "总览", "总"], ["systems", "系统选择中心", "系"], ["platform-accounts", "平台账号", "账"],
        ["platform-flow", "平台级 Flow", "流"], ["platform-apps", "平台级应用", "应"], ["platform-logs", "平台日志", "志"], ["platform-audits", "平台审计", "审"]
      ],
      system: [
        ["system-overview", "系统总览", "总"], ["system-members", "成员与部门", "人"], ["system-modules", "模块与字段", "模"],
        ["system-pages", "页面与菜单", "页"], ["system-app-configs", "系统内应用配置", "用"], ["system-flow-bindings", "流程事件绑定", "流"],
        ["system-logs", "系统日志", "志"], ["system-audits", "系统审计", "审"]
      ],
      runtime: [
        ["runtime-home", "工作台", "工"], ["runtime-data", "车辆档案", "车"], ["systems", "切换系统", "切"]
      ]
    };
    const state = { workspace: "platform", current: "identity", tab: "templates" };
    const $ = (sel, root = document) => root.querySelector(sel);
    const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

    function renderNav() {
      const list = $("#navList");
      list.innerHTML = `<div class="side-title">${state.workspace === "platform" ? "平台工作空间" : state.workspace === "system" ? "系统管理工作空间" : "系统运行工作空间"}</div>` +
        navs[state.workspace].map(([id, label, icon]) => `<button class="nav-item ${state.current === id ? "active" : ""}" data-go="${id}"><span class="nav-ico">${icon}</span><span class="nav-label">${label}</span></button>`).join("");
      $$("[data-go]", list).forEach(btn => btn.addEventListener("click", () => go(btn.dataset.go)));
    }
    function go(id) {
      state.current = id;
      $$(".screen").forEach(s => s.classList.toggle("active", s.id === id));
      renderNav();
      $("#main").scrollTop = 0;
    }
    function setWorkspace(workspace, target) {
      state.workspace = workspace;
      $$("#workspaceTabs button").forEach(btn => btn.classList.toggle("active", btn.dataset.workspace === workspace));
      renderAll();
      go(target || navs[workspace][0][0]);
    }
    function status(text, cls = "ok") { return `<span class="status ${cls}">${text}</span>`; }
    function pageHead(title, sub, actions = "") {
      return `<div class="page-head"><div><div class="breadcrumb">${state.workspace === "platform" ? "平台管理" : state.workspace === "system" ? "系统管理 / 车队运营系统" : "系统运行台 / 车队运营系统"}</div><h1>${title}</h1><div class="sub">${sub}</div></div><div class="tool-right">${actions}</div></div>`;
    }
    function filters(extra = "") {
      return `<div class="toolbar"><div class="tool-left"><input class="input" placeholder="关键词搜索" /><select class="select"><option>全部状态</option><option>正常</option><option>停用</option><option>维护中</option></select><button class="ghost-btn adv-toggle">高级筛选</button><span class="chip active">已选：最近 30 天</span></div><div class="tool-right">${extra}<button class="ghost-btn">列配置</button><button class="ghost-btn">保存视图</button></div></div><div class="panel adv-panel"><div class="filters"><select class="select"><option>操作者</option></select><select class="select"><option>风险等级</option></select><input class="input" placeholder="requestId / 追踪 ID" /><button class="btn">应用筛选</button><button class="ghost-btn">清空</button></div></div>`;
    }
    function pagination(total = "共 1,248 条") {
      return `<div class="pagination"><span>${total}，每页 20 条</span><div class="inline"><button class="page-btn">上一页</button><button class="page-btn active">1</button><button class="page-btn">2</button><button class="page-btn">3</button><button class="page-btn">下一页</button><input class="input" style="width:74px;min-width:74px" value="1" /></div></div>`;
    }
    function table(title, headers, rows, actions = true) {
      const head = headers.map(h => `<th>${h}</th>`).join("") + (actions ? "<th style='text-align:right'>操作</th>" : "");
      const body = rows.map((r, i) => `<tr>${r.map(c => `<td>${c}</td>`).join("")}${actions ? `<td><div class="actions"><button class="link-btn open-detail" data-title="${title}详情" data-row="${i}">详情</button><button class="link-btn open-edit" data-title="编辑${title}">编辑</button><button class="link-btn danger-action">停用</button></div></td>` : ""}</tr>`).join("");
      return `<div class="table-card"><div class="table-title"><strong>${title}</strong><span class="source-badge">筛选、分页、详情抽屉、操作列完整</span></div><div class="table-scroll"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>${pagination()}</div>`;
    }

    function renderIdentity() {

      $("#system-audits").innerHTML = pageHead("系统审计", "覆盖当前系统配置和业务高风险变更，只能看当前系统，不得跨系统查看。") + filters() + table("系统审计", ["时间","操作者","审计对象","所属模块 / 能力","审计动作","风险等级","结果","追踪 ID"], [["09:36","陈晓","字段权限","车辆档案","变更敏感字段可见性",status("高风险","bad"),status("已确认"),"sa-221"],["09:06","马航","维保申请","业务数据","删除记录",status("中风险","warn"),status("成功"),"sa-198"],["08:22","陈晓","菜单发布","页面与菜单","发布",status("低风险","info"),status("成功"),"sa-172"]]);
    }

    function renderRuntime() {
      $("#runtime-home").innerHTML = pageHead("车队运营系统 / 工作台", "普通业务用户只看到授权模块、待办、消息、常用数据和个人入口，不出现字段设计、页面发布或权限配置入口。", `<button class="btn primary open-drawer" data-kind="新建车辆档案">新建车辆档案</button>`) +
      `<div class="grid cols-4"><div class="metric card"><div class="label">我的待办</div><div class="num">18</div><div class="hint">超时 3</div></div><div class="metric card"><div class="label">可用模块</div><div class="num">7</div><div class="hint">按角色授权显示</div></div><div class="metric card"><div class="label">今日更新</div><div class="num">42</div><div class="hint">车辆、维保、保险</div></div><div class="metric card"><div class="label">未读消息</div><div class="num">9</div><div class="hint">系统公告 2</div></div></div><div class="split" style="margin-top:12px">${table("最近处理数据", ["模块","标题","状态","更新时间"], [["车辆档案","沪A8123 保险到期提醒",status("待处理","info"),"10 分钟前"],["维保申请","保养工单 MO-20260613-18",status("审批中","warn"),"38 分钟前"],["司机排班","周末高峰临时排班",status("已完成"),"昨天"]], false)}${table("我的待办", ["标题","流程","到达时间","优先级"], [["维保费用确认","维保费用审批","09:36",status("高","bad")],["车辆档案补全","车辆资料审批","08:50",status("中","warn")],["司机任务确认","任务通知 Flow","昨天",status("普通","info")]], false)}</div>`;
      $("#runtime-data").innerHTML = pageHead("车辆档案", "授权模块数据列表。动态字段、筛选、列配置、保存视图、分页、新建/编辑/详情抽屉和字段权限都在同一工作区内完成。", `<button class="btn primary open-drawer" data-kind="新建车辆档案">新建</button>`) + filters(`<button class="ghost-btn">批量操作</button><button class="ghost-btn">导出</button>`) + table("车辆档案", ["车牌号","车型","使用部门","保险状态","年检状态","负责人","更新时间"], [["沪A8123","厢式货车","运营中心",status("即将到期","warn"),status("正常"),"马航","今天 09:18"],["苏D3201","冷链车","配送一组",status("正常"),status("逾期","bad"),"周琪","昨天"],["浙B2290","新能源厢车","配送二组",status("正常"),status("正常"),"陈晓","06-11"]]);
    }

    function drawerContent(kind) {
      const isDetail = kind.includes("详情");
      return `<div class="form-section"><h3>基础信息</h3><div class="form-grid">
        <div class="field"><label>名称</label><input class="input" value="${kind.replace("新建","").replace("编辑","") || "车辆档案"}" ${isDetail ? "readonly" : ""}></div>
        <div class="field"><label>状态</label><select class="select"><option>正常</option><option>停用</option><option>维护中</option></select></div>
        <div class="field full"><label>说明</label><textarea class="textarea" ${isDetail ? "readonly" : ""}>用于展示统一右侧抽屉体系：新建、编辑、详情使用同一交互框架，保存失败不关闭抽屉。</textarea></div>
      </div></div><div class="form-section"><h3>权限与范围</h3><div class="form-grid"><div class="field"><label>可见角色</label><input class="input" value="系统管理员、普通成员" /></div><div class="field"><label>数据范围</label><select class="select"><option>本人及本部门</option><option>全部数据</option></select></div><div class="field full"><label>字段范围</label><input class="input" value="车牌号、车型、状态、负责人、更新时间" /></div></div></div><div class="notice">如果保存失败，字段级错误显示在字段下方，全局错误显示在抽屉顶部，用户输入会保留。</div>`;
    }
    function openDrawer(kind) {
      $("#drawerTitle").textContent = kind;
      $("#drawerSub").textContent = kind.includes("详情") ? "详情分组 / 操作日志 / 追踪信息" : "新建、编辑、详情统一右侧抽屉";
      $("#drawerBody").innerHTML = drawerContent(kind);
      $("#drawerMask").classList.add("open");
    }
    function closeDrawer() { $("#drawerMask").classList.remove("open"); }
    function openModal() {
      $("#modalBody").innerHTML = `<p>该操作会影响当前对象的访问和调用能力。停用后，相关入口将不可用，历史数据仍保留，可在审计日志中追踪。</p><p><strong>影响范围：</strong>当前系统、授权成员、对外应用调用和关联 Flow。</p>`;
      $("#modalMask").classList.add("open");
    }
    function showToast(text = "保存成功") {
      const t = $("#toast"); t.textContent = text; t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 1800);
    }
    function bindDynamic(root = document) {
      $$("[data-go]", root).forEach(btn => btn.onclick = () => go(btn.dataset.go));
      $$("[data-work]", root).forEach(btn => btn.onclick = () => setWorkspace(btn.dataset.work));
      $$(".open-drawer", root).forEach(btn => btn.onclick = () => openDrawer(btn.dataset.kind || "详情"));
      $$(".open-detail", root).forEach(btn => btn.onclick = () => openDrawer(btn.dataset.title || "详情"));
      $$(".open-edit", root).forEach(btn => btn.onclick = () => openDrawer(btn.dataset.title || "编辑"));
      $$(".danger-action", root).forEach(btn => btn.onclick = () => openModal());
      $$(".adv-toggle", root).forEach(btn => btn.onclick = () => {
        const panel = btn.closest(".screen").querySelector(".adv-panel");
        if (panel) panel.classList.toggle("open");
      });
    }
    function renderAll() {
      renderIdentity(); renderSystems(); renderCreateSystem(); renderPlatform(); renderSystem(); renderRuntime();
      renderNav(); bindDynamic();
    }
    $("#workspaceTabs").addEventListener("click", e => {
      const btn = e.target.closest("button[data-workspace]");
      if (btn) setWorkspace(btn.dataset.workspace);
    });
    $("#collapseBtn").onclick = () => document.body.classList.toggle("collapsed");
    $("#drawerClose").onclick = closeDrawer;
    $("#drawerCancel").onclick = closeDrawer;
    $("#drawerSave").onclick = () => { showToast("保存成功"); closeDrawer(); };
    $("#modalCancel").onclick = () => $("#modalMask").classList.remove("open");
    $("#modalConfirm").onclick = () => { $("#modalMask").classList.remove("open"); showToast("操作已确认，审计记录已生成"); };
    renderAll();
  </script>
</body>
</html>
