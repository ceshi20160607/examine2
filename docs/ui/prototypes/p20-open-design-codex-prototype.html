<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>examine2 P20 企业后台原型</title>
  <style>
    :root {
      --bg: oklch(98% 0.005 250);
      --surface: oklch(100% 0 0);
      --surface-2: oklch(96.5% 0.006 250);
      --fg: oklch(22% 0.02 240);
      --muted: oklch(50% 0.018 240);
      --border: oklch(90% 0.008 240);
      --accent: oklch(58% 0.16 145);
      --accent-soft: oklch(94% 0.045 145);
      --nav: oklch(25% 0.05 250);
      --nav-2: oklch(30% 0.055 250);
      --danger: oklch(58% 0.2 25);
      --warn: oklch(72% 0.14 80);
      --success: oklch(58% 0.16 145);
      --blue: oklch(56% 0.14 245);
      --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", system-ui, sans-serif;
      --font-body: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Microsoft YaHei", system-ui, sans-serif;
      --font-mono: "JetBrains Mono", "IBM Plex Mono", ui-monospace, Menlo, monospace;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font: 14px/1.55 var(--font-body);
      letter-spacing: 0;
      overflow: hidden;
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    .app { height: 100vh; display: grid; grid-template-rows: 56px 1fr; }
    .topbar {
      display: grid;
      grid-template-columns: 280px minmax(280px, 1fr) auto;
      align-items: center;
      gap: 20px;
      padding: 0 18px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      z-index: 20;
    }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .mark {
      width: 32px; height: 32px; border-radius: 8px;
      display: grid; place-items: center;
      color: white; background: linear-gradient(135deg, oklch(42% 0.08 250), oklch(56% 0.14 145));
      font-weight: 700;
    }
    .brand-title { font-weight: 650; white-space: nowrap; }
    .context { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .search {
      height: 34px;
      display: flex; align-items: center; gap: 8px;
      max-width: 560px;
      padding: 0 12px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--muted);
    }
    .search input { width: 100%; border: 0; outline: 0; background: transparent; color: var(--fg); }
    .actions { display: flex; align-items: center; gap: 8px; }
    .icon-btn {
      position: relative;
      height: 34px; min-width: 34px; padding: 0 9px;
      border: 1px solid transparent;
      border-radius: 6px;
      background: transparent;
      color: var(--fg);
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    }
    .icon-btn:hover, .icon-btn.active { background: var(--surface-2); border-color: var(--border); }
    .badge {
      position: absolute; top: 1px; right: 1px;
      min-width: 16px; height: 16px; padding: 0 4px;
      border-radius: 999px;
      background: var(--danger);
      color: #fff; font-size: 10px; line-height: 16px; text-align: center;
    }
    .user-chip {
      height: 36px; border: 1px solid var(--border); border-radius: 999px;
      padding: 0 10px 0 4px; background: var(--surface);
      display: flex; align-items: center; gap: 8px;
    }
    .avatar {
      width: 28px; height: 28px; border-radius: 50%;
      display: grid; place-items: center;
      color: white; background: var(--nav);
      font-size: 12px; font-weight: 650;
    }
    .shell { min-height: 0; display: grid; grid-template-columns: 232px 1fr; }
    .shell.collapsed { grid-template-columns: 72px 1fr; }
    .sider {
      background: var(--nav);
      color: oklch(92% 0.01 250);
      display: flex; flex-direction: column;
      min-width: 0;
    }
    .sider-head {
      height: 50px; padding: 0 14px;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }
    .workspace-name { font-size: 12px; color: rgba(255,255,255,.62); letter-spacing: .06em; text-transform: uppercase; }
    .collapse { color: #fff; background: transparent; border: 1px solid rgba(255,255,255,.12); border-radius: 6px; width: 30px; height: 30px; }
    .nav { padding: 10px 8px; overflow: auto; }
    .nav button {
      width: 100%; border: 0; color: rgba(255,255,255,.84);
      background: transparent; border-radius: 6px;
      min-height: 38px; padding: 0 10px; margin: 2px 0;
      display: grid; grid-template-columns: 24px 1fr; align-items: center; gap: 8px;
      text-align: left;
    }
    .nav button:hover { background: rgba(255,255,255,.08); }
    .nav button.active { background: var(--nav-2); color: white; box-shadow: inset 3px 0 0 var(--accent); }
    .nav .group { margin: 14px 10px 6px; color: rgba(255,255,255,.45); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
    .shell.collapsed .nav span.label, .shell.collapsed .workspace-name { display: none; }
    .content { min-width: 0; min-height: 0; overflow: auto; padding: 18px 22px 28px; }
    .page-head {
      display: flex; align-items: flex-start; justify-content: space-between; gap: 20px;
      margin-bottom: 14px;
    }
    h1 { margin: 0 0 4px; font: 650 24px/1.2 var(--font-display); letter-spacing: -0.01em; }
    .desc { color: var(--muted); max-width: 72ch; }
    .btns { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .btn {
      height: 32px; padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
      color: var(--fg);
      display: inline-flex; align-items: center; gap: 6px;
      font-weight: 520;
    }
    .btn.primary { background: var(--fg); color: #fff; border-color: var(--fg); }
    .btn.ghost { background: transparent; }
    .btn.danger { color: var(--danger); }
    .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; background: var(--surface); }
    .seg button { height: 30px; border: 0; border-right: 1px solid var(--border); padding: 0 12px; background: transparent; }
    .seg button:last-child { border-right: 0; }
    .seg button.active { background: var(--accent-soft); color: oklch(34% 0.12 145); font-weight: 650; }
    .grid { display: grid; gap: 12px; }
    .cards-4 { grid-template-columns: repeat(4, minmax(160px, 1fr)); }
    .cards-3 { grid-template-columns: repeat(3, minmax(220px, 1fr)); }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
    }
    .metric { display: flex; justify-content: space-between; gap: 12px; }
    .metric .num { font: 650 26px/1 var(--font-display); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
    .metric .label { color: var(--muted); font-size: 13px; }
    .trend { color: var(--success); font: 12px/1.4 var(--font-mono); }
    .split { display: grid; grid-template-columns: 1.1fr .9fr; gap: 12px; margin-top: 12px; }
    .panel-title { display:flex; justify-content:space-between; align-items:center; margin-bottom: 10px; }
    .panel-title h2 { margin:0; font: 650 16px/1.2 var(--font-display); letter-spacing: 0; }
    .list { display: grid; gap: 8px; }
    .item {
      display: flex; justify-content: space-between; gap: 12px; align-items: center;
      padding: 10px 0; border-bottom: 1px solid var(--border);
    }
    .item:last-child { border-bottom: 0; }
    .title { font-weight: 560; }
    .sub { color: var(--muted); font-size: 12px; }
    .tag {
      display: inline-flex; align-items: center; gap: 4px;
      height: 22px; padding: 0 8px; border-radius: 999px;
      font-size: 12px; border: 1px solid var(--border); background: var(--surface-2);
      white-space: nowrap;
    }
    .tag.ok { color: oklch(38% 0.13 145); background: var(--accent-soft); border-color: oklch(86% 0.07 145); }
    .tag.warn { color: oklch(42% 0.12 80); background: oklch(95% 0.045 80); border-color: oklch(86% 0.07 80); }
    .tag.bad { color: var(--danger); background: oklch(96% 0.035 25); border-color: oklch(88% 0.06 25); }
    .toolbar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .filters { display: grid; grid-template-columns: 1.2fr 160px 160px 160px auto; gap: 8px; align-items: center; }
    .field {
      height: 32px; border: 1px solid var(--border); border-radius: 6px;
      background: var(--surface); padding: 0 10px; min-width: 0;
    }
    .advanced { display: none; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
    .advanced.show { display: grid; }
    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      font-variant-numeric: tabular-nums;
    }
    th, td {
      height: 42px; padding: 0 12px;
      border-bottom: 1px solid var(--border);
      text-align: left; white-space: nowrap;
    }
    th { background: var(--surface-2); color: var(--muted); font-weight: 600; font-size: 12px; }
    tr:last-child td { border-bottom: 0; }
    td.actions-cell { color: var(--blue); }
    td.actions-cell button { border: 0; background: transparent; color: var(--blue); margin-right: 8px; padding: 0; }
    .pagination {
      height: 44px; display: flex; align-items: center; justify-content: flex-end; gap: 8px;
      color: var(--muted); font-size: 13px;
    }
    .pager-btn { border: 1px solid var(--border); background: var(--surface); border-radius: 6px; width: 30px; height: 30px; }
    .drawer-mask, .popover-mask {
      position: fixed; inset: 0; background: rgba(10, 14, 26, .18); display: none; z-index: 50;
    }
    .drawer-mask.show, .popover-mask.show { display: block; }
    .drawer {
      position: absolute; top: 0; right: 0; width: min(640px, 100vw); height: 100%;
      background: var(--surface);
      box-shadow: -20px 0 45px rgba(15, 23, 42, .16);
      display: grid; grid-template-rows: 56px 1fr 58px;
    }
    .drawer-head, .drawer-foot {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 0 18px; border-bottom: 1px solid var(--border);
    }
    .drawer-foot { border-top: 1px solid var(--border); border-bottom: 0; justify-content: flex-end; }
    .drawer-body { overflow: auto; padding: 18px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .form-row { display: grid; gap: 6px; }
    .form-row.full { grid-column: 1 / -1; }
    .form-row label { color: var(--muted); font-size: 12px; }
    textarea.field { height: 78px; padding-top: 8px; resize: vertical; }
    .popover {
      position: fixed; top: 54px; right: 18px; width: 360px; max-height: calc(100vh - 80px); overflow: auto;
      background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
      box-shadow: 0 20px 50px rgba(15, 23, 42, .18); padding: 12px; z-index: 60;
    }
    .role-menu { display: grid; gap: 6px; margin-top: 10px; }
    .role-menu button { text-align: left; height: 38px; border: 1px solid var(--border); background: var(--surface); border-radius: 6px; padding: 0 10px; }
    .role-menu button.active { background: var(--accent-soft); border-color: oklch(82% 0.07 145); }
    .progress { display: grid; gap: 8px; }
    .step { display: grid; grid-template-columns: 24px 1fr auto; gap: 8px; align-items: center; }
    .dot { width: 20px; height: 20px; border-radius: 50%; background: var(--accent-soft); color: oklch(34% 0.12 145); display: grid; place-items: center; font-size: 12px; font-weight: 700; }
    .bar { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
    .bar i { display:block; height:100%; background: var(--accent); }
    .chart { height: 210px; display: flex; align-items: end; gap: 12px; padding: 14px 6px 2px; border-bottom: 1px solid var(--border); }
    .chart b { flex: 1; min-width: 18px; background: color-mix(in oklch, var(--accent), white 18%); border-radius: 4px 4px 0 0; }
    .empty {
      min-height: 160px; display:grid; place-items:center; text-align:center;
      color: var(--muted); border: 1px dashed var(--border); border-radius: 8px; background: var(--surface);
    }
    .kbd { font: 12px/1 var(--font-mono); padding: 2px 5px; border: 1px solid var(--border); border-radius: 4px; background: var(--surface-2); }
    @media (max-width: 1180px) {
      .topbar { grid-template-columns: 220px 1fr auto; }
      .cards-4 { grid-template-columns: repeat(2, minmax(160px, 1fr)); }
      .split { grid-template-columns: 1fr; }
      .filters { grid-template-columns: 1fr 1fr; }
      .advanced { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 760px) {
      body { overflow: auto; }
      .app { min-height: 100vh; height: auto; }
      .topbar { position: sticky; top:0; grid-template-columns: 1fr; height:auto; padding:10px; gap:10px; }
      .actions { flex-wrap: wrap; }
      .shell, .shell.collapsed { grid-template-columns: 1fr; }
      .sider { position: sticky; top: 0; z-index: 10; max-height: 260px; }
      .content { overflow: visible; padding: 14px; }
      .page-head { display: grid; }
      .cards-4, .cards-3, .form-grid, .filters, .advanced { grid-template-columns: 1fr; }
      table { display:block; overflow:auto; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="mark">E2</div>
        <div>
          <div class="brand-title">统一业务平台</div>
          <div class="context" id="contextText">平台管理</div>
        </div>
      </div>
      <label class="search" aria-label="全局搜索">
        <span>⌕</span>
        <input id="globalSearch" placeholder="搜索当前上下文可见内容、业务数据、requestId" />
      </label>
      <div class="actions">
        <button class="icon-btn" data-pop="approval" title="审批">审<span class="badge">6</span></button>
        <button class="icon-btn" data-pop="todo" title="待办">待<span class="badge">12</span></button>
        <button class="icon-btn" data-pop="message" title="消息">信<span class="badge">8</span></button>
        <button class="icon-btn" data-pop="log" title="日志">日志</button>
        <button class="icon-btn" data-page="systemCenter" title="切换系统">切换系统</button>
        <button class="user-chip" data-pop="user" title="用户菜单"><span class="avatar">陈</span><span id="userText">陈知远 · 平台管理员</span></button>
      </div>
    </header>
    <main class="shell" id="shell">
      <aside class="sider">
        <div class="sider-head">
          <span class="workspace-name" id="workspaceName">平台工作区</span>
          <button class="collapse" id="collapseBtn" title="展开或收起左侧导航">☰</button>
        </div>
        <nav class="nav" id="sideNav" aria-label="当前角色导航"></nav>
      </aside>
      <section class="content" id="content"></section>
    </main>
  </div>

  <div class="popover-mask" id="popoverMask"></div>
  <div class="drawer-mask" id="drawerMask">
    <aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
      <div class="drawer-head">
        <strong id="drawerTitle">详情</strong>
        <button class="icon-btn" id="closeDrawer" title="关闭">×</button>
      </div>
      <div class="drawer-body" id="drawerBody"></div>
      <div class="drawer-foot">
        <button class="btn" id="cancelDrawer">取消</button>
        <button class="btn primary" id="saveDrawer">保存</button>
      </div>
    </aside>
  </div>

  <script>
    const state = {
      role: "platform",
      page: "platformHome",
      collapsed: false,
      advanced: false,
      cardView: false
    };

    const roles = {
      platform: {
        name: "平台管理员",
        user: "陈知远",
        workspace: "平台工作区",
        context: "平台管理",
        home: "platformHome",
        nav: [
          ["总览", [["platformHome", "平台首页", "⌂"], ["systemCenter", "系统中心", "▦"], ["platformAccounts", "平台账号", "人"]]],
          ["平台能力", [["platformFlow", "平台级 Flow", "流"], ["platformApps", "平台级对外应用", "钥"], ["platformLogs", "平台日志 / 审计", "志"]]],
          ["治理", [["ops", "运维监控", "仪"]]]
        ]
      },
      system: {
        name: "系统管理员",
        user: "林若楠",
        workspace: "系统管理工作区",
        context: "车队运营系统 / 系统管理",
        home: "systemHome",
        nav: [
          ["系统", [["systemHome", "系统首页", "⌂"], ["members", "成员与部门", "人"], ["roles", "角色与权限", "权"], ["dict", "字典管理", "典"]]],
          ["建模配置", [["modules", "模块与字段", "模"], ["pages", "页面与菜单", "页"], ["internalApps", "系统内应用配置", "配"], ["eventBinding", "流程事件绑定", "绑"]]],
          ["审计", [["systemLogs", "系统日志 / 审计", "志"]]]
        ]
      },
      business: {
        name: "普通业务用户",
        user: "周启明",
        workspace: "业务运行工作区",
        context: "车队运营系统 / 业务运行",
        home: "businessHome",
        nav: [
          ["我的工作", [["businessHome", "工作台", "⌂"], ["myTodo", "我的待办", "待"]]],
          ["授权模块", [["moduleData", "车辆档案", "车"], ["maintenance", "维保与保险", "修"], ["driverTask", "司机任务", "任"]]],
          ["个人", [["files", "文件 / 导出", "文"], ["myMessage", "我的消息", "信"], ["profile", "个人中心", "人"]]]
        ]
      },
      integration: {
        name: "集成管理员",
        user: "许知秋",
        workspace: "开放中心工作区",
        context: "平台开放中心",
        home: "openHome",
        nav: [
          ["开放治理", [["openHome", "开放首页", "⌂"], ["platformApps", "对外应用", "钥"], ["credential", "凭证管理", "证"], ["scope", "授权范围", "权"]]],
          ["安全", [["ipList", "IP 白名单", "网"], ["rateLimit", "限流策略", "限"], ["callLogs", "调用日志", "志"], ["riskAudit", "风险审计", "审"]]]
        ]
      }
    };

    const pageMeta = {
      platformHome: ["平台首页", "查看平台系统、账号、对外应用、Flow 和审计的总体运行情况。"],
      systemCenter: ["系统选择中心", "面向上百上千系统的搜索、筛选、收藏和进入入口，不进入左侧导航。"],
      platformAccounts: ["平台账号", "维护平台账号、开通状态、风险状态和所属组织。"],
      platformFlow: ["平台级 Flow", "平台层流程模板、流程实例、待审批和流程日志，独立于平台级对外应用。"],
      platformApps: ["平台级对外应用", "创建外部接入应用，维护凭证、授权范围、白名单、限流和调用日志。"],
      platformLogs: ["平台日志 / 审计", "平台账号、系统创建、对外应用、平台流程和运维诊断的分层追踪。"],
      ops: ["运维监控", "平台健康、服务状态、异常队列和部署版本。"],
      systemHome: ["系统首页", "当前业务系统的搭建进度、配置建议、快捷入口和最近变更。"],
      members: ["成员与部门", "在当前系统内开通成员、维护部门和角色，不要求跳转到平台账号。"],
      roles: ["角色与权限", "配置菜单、按钮、字段、数据范围和导出权限。"],
      dict: ["字典管理", "维护当前系统内的业务字典和级联字典。"],
      modules: ["模块与字段", "配置业务模块、字段、发布状态和运行台入口。"],
      pages: ["页面与菜单", "维护列表页、表单页、详情页、菜单入口和发布检查。"],
      internalApps: ["系统内应用配置", "配置当前系统如何启用平台级对外应用能力，独立于流程事件绑定。"],
      eventBinding: ["流程事件绑定", "把模块事件绑定到流程模板，表达数据提交后的审批触发规则。"],
      systemLogs: ["系统日志 / 审计", "当前系统内配置、业务数据、流程、文件和 OpenAPI 调用追踪。"],
      businessHome: ["工作台", "普通业务用户的待办、常用模块、快速新建、最近数据和消息。"],
      myTodo: ["我的待办", "只展示当前用户需要处理的审批、抄送和业务任务。"],
      moduleData: ["车辆档案", "授权模块数据列表，支持查询、筛选、分页、新建、编辑、详情和导出。"],
      maintenance: ["维保与保险", "授权业务模块列表，普通用户只能处理有权限的数据。"],

          <div class="form-row"><label>创建人</label><input class="field" value="${currentRole().user}" /></div>
          <div class="form-row"><label>默认管理员</label><input class="field" value="林若楠" /></div>
          <div class="form-row full"><label>业务说明</label><textarea class="field">用于车辆档案、维保保险、司机任务和车联网对外接入管理。</textarea></div>
        </div>`;
    }

    function genericDrawer(title) {
      const historyItems = state.role === "business"
        ? [["新增记录", "今天 09:18 · 周启明"], ["补充年检照片", "今天 09:58 · 已保存"], ["提交审批", "今天 10:21 · 等待处理"]]
        : [["创建草稿", "今天 09:18 · 林若楠"], ["发布检查", "今天 09:58 · 缺少菜单入口"], ["修复并重新提交", "今天 10:21 · 通过"]];
      return `
        <div class="form-grid">
          <div class="form-row"><label>名称</label><input class="field" value="${title}" /></div>
          <div class="form-row"><label>状态</label><select class="field"><option>已启用</option><option>草稿</option><option>待复核</option></select></div>
          <div class="form-row"><label>所属上下文</label><input class="field" value="${currentRole().context}" /></div>
          <div class="form-row"><label>负责人</label><input class="field" value="${currentRole().user}" /></div>
          <div class="form-row full"><label>${state.role === "business" ? "业务说明" : "权限与影响范围"}</label><textarea class="field">${state.role === "business" ? "保存前会校验必填字段、审批状态和本人数据范围。保存失败时抽屉不会关闭，并会提示可恢复原因。" : "保存前会校验菜单权限、字段权限、数据范围和发布状态。无权限入口会隐藏或禁用，并给出中文原因。"}</textarea></div>
          <div class="form-row full"><label>最近追踪</label><input class="field" value="requestId：REQ-9F2A-021 · 来源：Web · 结果：成功" /></div>
        </div>
        <div class="card" style="margin-top:14px"><div class="panel-title"><h2>操作历史</h2><span class="tag ok">可追溯</span></div>${listItems(historyItems)}</div>`;
    }

    function openPopover(type) {
      closePopover();
      const mask = document.getElementById("popoverMask");
      const node = document.createElement("div");
      node.className = "popover";
      node.id = "activePopover";
      const titles = { approval: "待审批", todo: "我的待办", message: "消息中心", log: "快捷日志", user: "用户菜单" };
      if (type === "user") {
        node.innerHTML = `<div class="panel-title"><h2>${currentRole().user}</h2><span class="tag">${currentRole().name}</span></div><div class="sub">${currentRole().context}</div><div class="role-menu">${Object.entries(roles).map(([key, r]) => `<button class="${state.role === key ? "active" : ""}" data-role="${key}">${r.name} · ${r.context}</button>`).join("")}</div><div class="btns" style="margin-top:12px"><button class="btn" data-drawer="个人中心">个人中心</button><button class="btn danger" id="logoutBtn">退出登录</button></div>`;
      } else {
        const byRole = {
          platform: {
            approval: [["对外应用授权审批", "车联网外部接入申请访问车辆档案"], ["流程发布复核", "密钥轮换复核 v1 待发布"]],
            todo: [["系统创建审批", "采购协同系统申请开通"], ["平台账号风险复核", "许知秋存在高权限变更"]],
            message: [["平台消息", "7 个系统健康检查完成"], ["安全提醒", "BI 只读分析凭证 29 天后到期"]]
          },
          system: {
            approval: [["页面发布复核", "车辆档案列表页待发布"], ["流程绑定复核", "车辆档案提交事件待确认"]],
            todo: [["页面发布失败处理", "缺少菜单入口，需系统管理员修复"], ["成员授权待完善", "周启明缺少导出权限"]],
            message: [["系统消息", "车辆审批流程已产生 3 条新待办"], ["发布检查", "保单记录表单仍缺必填提示"]]
          },
          business: {
            approval: [["车辆档案审批退回", "浙B·6C18 缺少负责人"], ["维保记录待确认", "苏E·3P92 保险即将到期"]],
            todo: [["车辆档案待补充", "沪A·8K26 · 今天 18:00 前"], ["司机任务待回单", "任务 T-20260613-08 待提交"]],
            message: [["业务消息", "车辆审批流程有 2 条处理结果"], ["系统提醒", "你有 3 条车辆档案即将年检到期"]]
          },
          integration: {
            approval: [["授权范围复核", "车联网外部接入申请新增字段"], ["密钥轮换审批", "BI 只读分析将在 29 天后到期"]],
            todo: [["异常调用排查", "REQ-7C4D-884 scope 不足"], ["限流策略复核", "外部同步应用命中阈值"]],
            message: [["开放中心消息", "14 次限流命中已归档"], ["安全提醒", "新增 IP 白名单待确认"]]
          }
        };
        const items = type === "log"
          ? [["平台日志", "查看平台账号、应用、Flow 和运维记录"], ["系统日志", "查看当前系统配置和业务数据变更"]]
          : byRole[state.role][type];
        node.innerHTML = `<div class="panel-title"><h2>${titles[type]}</h2><button class="btn" data-page="${type === "log" ? (state.role === "platform" ? "platformLogs" : "systemLogs") : "myTodo"}">进入列表</button></div>${listItems(items)}`;
      }
      document.body.appendChild(node);
      mask.classList.add("show");
    }

    function closePopover() {
      document.getElementById("popoverMask").classList.remove("show");
      const old = document.getElementById("activePopover");
      if (old) old.remove();
    }

    document.addEventListener("click", (e) => {
      const pageBtn = e.target.closest("[data-page]");
      if (pageBtn) {
        state.page = pageBtn.dataset.page;
        closePopover();
        render();
        return;
      }
      const popBtn = e.target.closest("[data-pop]");
      if (popBtn) { openPopover(popBtn.dataset.pop); return; }
      const drawerBtn = e.target.closest("[data-drawer]");
      if (drawerBtn) { openDrawer(drawerBtn.dataset.drawer); return; }
      const roleBtn = e.target.closest("[data-role]");
      if (roleBtn) {
        state.role = roleBtn.dataset.role;
        state.page = roles[state.role].home;
        closePopover();
        render();
        return;
      }
      if (e.target.id === "advancedBtn") { state.advanced = !state.advanced; render(); return; }
      if (e.target.id === "cardView") { state.cardView = true; render(); return; }
      if (e.target.id === "tableView") { state.cardView = false; render(); return; }
    });
    document.getElementById("collapseBtn").addEventListener("click", () => { state.collapsed = !state.collapsed; render(); });
    document.getElementById("popoverMask").addEventListener("click", closePopover);
    document.getElementById("closeDrawer").addEventListener("click", () => document.getElementById("drawerMask").classList.remove("show"));
    document.getElementById("cancelDrawer").addEventListener("click", () => document.getElementById("drawerMask").classList.remove("show"));
    document.getElementById("saveDrawer").addEventListener("click", () => {
      const btn = document.getElementById("saveDrawer");
      btn.textContent = "已保存";
      setTimeout(() => { btn.textContent = "保存"; document.getElementById("drawerMask").classList.remove("show"); }, 650);
    });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") { closePopover(); document.getElementById("drawerMask").classList.remove("show"); } });
    render();
  </script>
</body>
</html>
