<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>模块组 · 系统后台</title>
  <link rel="stylesheet" href="../css/app.css">
</head>
<body>
  <div class="app-shell">
    <aside class="app-sidebar">
      <div class="app-sidebar-brand">车系统</div>
      <nav class="app-sidebar-nav">
        <a href="admin-home.html">首页引导</a>
        <a href="admin-basic.html">基础参数</a>
        <a href="admin-dict.html">数据字典</a>
        <a href="admin-datasource.html">数据源</a>
        <a href="admin-dashboard-cfg.html">仪表盘配置</a>
        <a href="admin-module-group.html" class="active">模块组</a>
        <a href="admin-module.html">模块</a>
        <a href="admin-modeling.html">建模</a>
        <a href="admin-members.html">成员与角色</a>
        <a href="admin-flow.html">流程</a>
        <a href="admin-external-app.html">对外应用</a>
      </nav>
      <div class="app-sidebar-footer">
        <a href="dashboard-admin.html" class="btn btn-ghost btn-sm" style="width:100%">返回运行态</a>
      </div>
    </aside>
    <div class="app-main">
      <header class="app-topbar">
        <div class="app-topbar-left"><span style="font-weight:600">模块组</span></div>
      </header>
      <main class="app-content">
        <div class="page-header">
          <h1>模块组</h1>
          <p>模块组对应运行态顶栏导航，点击后左侧显示组内模块列表。</p>
        </div>
        <div class="toolbar">
          <div class="toolbar-left">
            <div class="search-input">
              <input type="search" placeholder="搜索模块组…">
            </div>
          </div>
          <div class="toolbar-right">
            <button type="button" class="btn btn-primary" data-open-modal="modal-create-group">新建模块组</button>
          </div>
        </div>
        <div class="card">
          <table class="data-table" data-table>
            <thead>
              <tr>
                <th>组名称</th>
                <th>组编码</th>
                <th>模块数</th>
                <th>排序</th>
                <th>状态</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td><strong>车辆管理</strong></td>
                <td class="num">vehicle_mgmt</td>
                <td class="num">3</td>
                <td class="num">1</td>
                <td><span class="badge badge-success">已发布</span></td>
                <td>
                  <a href="admin-module.html" class="btn btn-ghost btn-sm">管理模块</a>
                  <button type="button" class="btn btn-ghost btn-sm">编辑</button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </main>
    </div>
  </div>

  <div class="modal-overlay" id="modal-create-group">
    <div class="modal">
      <div class="modal-header">
        <h3>新建模块组</h3>
        <button type="button" class="btn-icon" data-close-modal aria-label="关闭"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
      </div>
      <form data-validate-form data-success="模块组已创建">
        <div class="modal-body">
          <div class="field">
            <label for="group-name">组名称</label>
            <input type="text" id="group-name" placeholder="如：车辆管理" required>
          </div>
          <div class="field">
            <label for="group-code">组编码</label>
            <input type="text" id="group-code" placeholder="如：vehicle_mgmt" required>
          </div>
          <div class="field">
            <label for="group-sort">排序</label>
            <input type="number" id="group-sort" value="1">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-close-modal>取消</button>
          <button type="submit" class="btn btn-primary">创建</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/app.js"></script>
</body>
</html>
