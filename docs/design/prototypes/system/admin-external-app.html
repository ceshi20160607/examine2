<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>系统对外应用 · unexamine</title>
  <link rel="stylesheet" href="../assets/app.css">
  <style>
    .app-workspace{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:0;border:1px solid var(--border);border-radius:8px;overflow:hidden;min-height:480px}
    .app-drawer{border-left:1px solid var(--border);background:#fafbfc;padding:14px;overflow:auto}
    .app-drawer h2{margin:0 0 12px;font-size:15px}
    .cfg-row{display:grid;grid-template-columns:88px 1fr;gap:8px;align-items:center;margin-bottom:10px;font-size:13px}
    .cfg-row label{color:var(--muted)}
    .cfg-row input,.cfg-row select{width:100%;border:1px solid var(--border);border-radius:6px;padding:6px 8px}
    tr.row-active td{background:#eef4ff}
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar"><a class="brand" href="../index.html">unexamine</a><select class="context-switch"><option>车系统</option></select><nav class="top-tabs"><a href="../system/admin-home.html">系统后台</a></nav><div class="top-actions"><span class="avatar">陈</span></div></header>
    <aside class="sidebar"><div class="side-title">系统后台</div><nav class="nav"><a class="active" href="admin-external-app.html">对外应用</a></nav></aside>
    <main class="main">
      <div class="page-head">
        <div class="page-title"><h1>系统对外应用</h1><p>参数映射 config-spec §9.1 · 样例 seed §12</p></div>
        <button class="btn primary">新建应用</button>
      </div>
      <div class="app-workspace">
        <section class="panel table-wrap" style="border:0">
          <table class="table">
            <thead><tr><th>应用名称</th><th>凭证</th><th>状态</th><th>授权模块</th><th>操作</th></tr></thead>
            <tbody>
              <tr class="row-active"><td>交管同步</td><td>sk_****7812</td><td><span class="status ok"><span class="dot"></span>启用</span></td><td>车辆档案·查询</td><td><button class="btn weak">编辑</button></td></tr>
              <tr><td>维保推送</td><td>sk_****9012</td><td><span class="status warn"><span class="dot"></span>待发布</span></td><td>维保记录·写入</td><td><button class="btn weak">编辑</button></td></tr>
            </tbody>
          </table>
        </section>
        <aside class="app-drawer">
          <h2>编辑 · 交管同步</h2>
          <div class="tabs" style="margin-bottom:12px"><button class="active">基础</button><button>参数映射</button><button>调用日志</button></div>
          <p style="font-size:12px;color:var(--muted);margin:0 0 10px">请求参数映射</p>
          <table class="table">
            <thead><tr><th>接口参数</th><th>来源模块</th><th>来源字段</th><th>方向</th><th>必填</th></tr></thead>
            <tbody>
              <tr><td>plateNo</td><td>车辆档案</td><td>plate_no</td><td>请求</td><td>是</td></tr>
              <tr><td>status</td><td>车辆档案</td><td>vehicle_status</td><td>请求</td><td>是</td></tr>
              <tr><td>deptName</td><td>车辆档案</td><td>dept_id</td><td>响应</td><td>否</td></tr>
            </tbody>
          </table>
          <div style="margin-top:12px;display:flex;gap:8px;justify-content:flex-end"><button class="btn">取消</button><button class="btn primary">保存</button></div>
        </aside>
      </div>
    </main>
  </div>
  <script src="../assets/app.js"></script>
</body>
</html>
