<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>仪表盘配置 · unexamine</title>
  <link rel="stylesheet" href="../assets/app.css">
  <style>
    .dash-designer{display:grid;grid-template-columns:200px minmax(0,1fr)260px;gap:0;border:1px solid var(--border);border-radius:8px;overflow:hidden;min-height:520px;background:var(--surface)}
    .comp-palette{border-right:1px solid var(--border);padding:12px;background:#fafbfc}
    .comp-palette h3,.props h3{margin:0 0 10px;font-size:12px;color:var(--muted)}
    .comp-item{display:block;padding:8px 10px;margin-bottom:6px;border:1px solid var(--border);border-radius:6px;font-size:13px;background:#fff}
    .dash-canvas{padding:16px;background:#f5f7fa;min-height:480px}
    .dash-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px}
    .dash-widget{padding:12px;background:#fff;border:1px solid var(--border);border-radius:8px;min-height:80px}
    .dash-widget.selected{border-color:var(--accent);box-shadow:0 0 0 2px rgba(37,99,235,.15)}
    .props{border-left:1px solid var(--border);padding:14px}
    .cfg-row{display:grid;grid-template-columns:72px 1fr;gap:8px;align-items:center;margin-bottom:10px;font-size:13px}
    .cfg-row label{color:var(--muted)}
    .cfg-row input,.cfg-row select{width:100%;border:1px solid var(--border);border-radius:6px;padding:6px 8px}
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar"><a class="brand" href="../index.html">unexamine</a><select class="context-switch"><option>车系统</option></select><nav class="top-tabs"><a href="../system/admin-home.html">系统后台</a></nav><div class="top-actions"><span class="avatar">陈</span></div></header>
    <aside class="sidebar"><div class="side-title">系统后台</div><nav class="nav"><a class="active" href="admin-dashboard-cfg.html">仪表盘配置</a><a href="admin-datasource.html">数据源</a></nav></aside>
    <main class="main">
      <div class="page-head">
        <div class="page-title"><h1>仪表盘配置</h1><p>组件库 · 栅格画布 · 属性面板（非运行态预览）</p></div>
        <div style="display:flex;gap:8px"><button class="btn">预览</button><button class="btn primary">发布</button></div>
      </div>
      <div class="dash-designer">
        <aside class="comp-palette">
          <h3>组件库</h3>
          <span class="comp-item">统计卡</span>
          <span class="comp-item">模块组入口</span>
          <span class="comp-item">筛选按钮</span>
          <span class="comp-item">图表（占位）</span>
        </aside>
        <section class="dash-canvas">
          <div class="dash-grid">
            <div class="dash-widget selected"><div class="label">车辆总数</div><div class="value mono">126</div></div>
            <div class="dash-widget"><div class="label">在用车辆</div><div class="value mono">92</div></div>
            <div class="dash-widget"><div class="label">待年检</div><div class="value mono">18</div></div>
            <div class="dash-widget"><div class="label">我的待办</div><div class="value mono">3</div></div>
          </div>
          <div class="dash-widget" style="max-width:320px"><strong>车辆管理</strong><div class="list-card" style="margin-top:8px"><a>车辆档案</a><a>维保记录</a><a>驾驶员</a></div></div>
        </section>
        <aside class="props">
          <h3>属性 · 统计卡</h3>
          <div class="cfg-row"><label>标题</label><input value="车辆总数"></div>
          <div class="cfg-row"><label>数据源</label><select><option selected>车辆总数 COUNT</option><option>在用车辆 场景</option></select></div>
          <div class="cfg-row"><label>图标</label><select><option>车辆</option><option>数字</option></select></div>
          <div class="cfg-row"><label>栅格宽</label><select><option>1/4</option></select></div>
        </aside>
      </div>
    </main>
  </div>
  <script src="../assets/app.js"></script>
</body>
</html>
