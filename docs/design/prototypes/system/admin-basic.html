<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>基础参数 · 系统后台</title>
  <link rel="stylesheet" href="../css/app.css">
</head>
<body>
  <div class="app-shell">
    <aside class="app-sidebar">
      <div class="app-sidebar-brand">车系统</div>
      <nav class="app-sidebar-nav">
        <a href="admin-home.html">首页引导</a>
        <a href="admin-basic.html" class="active">基础参数</a>
        <a href="admin-dict.html">数据字典</a>
        <a href="admin-datasource.html">数据源</a>
        <a href="admin-dashboard-cfg.html">仪表盘配置</a>
        <a href="admin-module-group.html">模块组</a>
        <a href="admin-module.html">模块</a>
        <a href="admin-modeling.html">建模</a>
        <a href="admin-members.html">成员与角色</a>
        <a href="admin-flow.html">流程</a>
        <a href="admin-external-app.html">对外应用</a>
      </nav>
      <div class="app-sidebar-footer">
        <a href="dashboard-admin.html" class="btn btn-ghost btn-sm" style="width:100%">返回运行态</a>
      </div>
    </aside>
    <div class="app-main">
      <header class="app-topbar">
        <div class="app-topbar-left"><span style="font-weight:600">基础参数</span></div>
      </header>
      <main class="app-content">
        <div class="page-header">
          <h1>基础参数</h1>
          <p>配置系统名称、图标、编码及访问地址，影响登录页与运行态展示。</p>
        </div>
        <div class="card" style="max-width:640px">
          <form data-validate-form data-success="基础参数已保存">
            <div class="field">
              <label for="sys-name">系统名称</label>
              <input type="text" id="sys-name" value="车系统" required>
            </div>
            <div class="field">
              <label for="sys-icon">系统图标</label>
              <input type="text" id="sys-icon" value="车" placeholder="图标字符或 URL">
              <span class="field-help">运行态顶栏与登录页将显示此图标</span>
            </div>
            <div class="field">
              <label for="sys-code">系统编码</label>
              <input type="text" id="sys-code" value="che-system" required>
              <span class="field-help">唯一标识，创建后不建议修改</span>
            </div>
            <div class="field">
              <label for="sys-domain">域名 / 访问地址</label>
              <input type="url" id="sys-domain" value="https://che.demo.unexamine.cn" required>
              <span class="field-help">成员通过此地址访问运行态</span>
            </div>
            <div style="display:flex;gap:var(--space-2);margin-top:var(--space-4)">
              <button type="submit" class="btn btn-primary">保存</button>
              <button type="reset" class="btn btn-secondary">重置</button>
            </div>
          </form>
        </div>
      </main>
    </div>
  </div>
  <script src="../js/app.js"></script>
</body>
</html>
