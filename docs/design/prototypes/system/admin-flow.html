<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>流程配置 · unexamine</title>
  <link rel="stylesheet" href="../assets/app.css">
  <style>
    .flow-workspace{display:grid;grid-template-columns:200px minmax(0,1fr)280px;gap:0;border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden;min-height:520px;background:var(--surface)}
    .flow-palette{border-right:1px solid var(--border);background:#fafbfc;padding:12px}
    .flow-palette h3{margin:0 0 10px;font-size:12px;color:var(--muted)}
    .flow-node-type{display:block;padding:8px 10px;margin-bottom:6px;border:1px solid var(--border);border-radius:6px;font-size:13px;background:var(--surface)}
    .flow-canvas-wrap{position:relative;background:#f5f7fa;min-height:480px;border-right:1px solid var(--border)}
    .flow-props{padding:14px;background:var(--surface);overflow:auto}
    .flow-props h3{margin:0 0 12px;font-size:14px}
    .cfg-row{display:grid;grid-template-columns:80px minmax(0,1fr);gap:8px;align-items:center;margin-bottom:10px;font-size:13px}
    .cfg-row label{color:var(--muted)}
    .cfg-row input,.cfg-row select{width:100%;border:1px solid var(--border);border-radius:6px;padding:6px 8px}
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="../index.html">unexamine</a>
      <select class="context-switch"><option>车系统</option></select>
      <nav class="top-tabs"><a href="../system/dashboard-admin.html">仪表盘</a><a href="../system/runtime-list.html">车辆管理</a><a class="active" href="../system/admin-home.html">系统后台</a></nav>
      <div class="top-actions"><span class="avatar">陈</span></div>
    </header>
    <aside class="sidebar"><div class="side-title">系统后台</div><nav class="nav"><a class="active" href="admin-flow.html">流程配置</a></nav></aside>
    <main class="main">
      <div class="page-head">
        <div class="page-title"><h1>流程配置 · 车辆状态变更审批</h1><p>三栏：节点面板 · 画布 · 节点属性（config-spec §9.3）</p></div>
        <div style="display:flex;gap:8px"><button class="btn">预览</button><button class="btn primary">保存并发布</button></div>
      </div>
      <div class="flow-workspace">
        <aside class="flow-palette">
          <h3>拖入画布</h3>
          <span class="flow-node-type">审批节点</span>
          <span class="flow-node-type">条件节点</span>
          <span class="flow-node-type">抄送节点</span>
          <span class="flow-node-type">外部 API</span>
        </aside>
        <section class="flow-canvas-wrap canvas" data-od-id="flow-canvas">
          <div class="node" style="left:40px;top:48px"><strong>触发</strong>车辆状态变更</div>
          <div class="node" style="left:220px;top:120px;border-color:var(--accent)"><strong>审批</strong>车辆主管</div>
          <div class="node" style="left:400px;top:200px"><strong>结束</strong>更新记录</div>
        </section>
        <aside class="flow-props">
          <h3>节点属性 · 审批</h3>
          <div class="cfg-row"><label>节点名称</label><input value="车辆主管审批"></div>
          <div class="cfg-row"><label>审批人</label><select><option>按角色</option><option>指定成员</option></select></div>
          <div class="cfg-row"><label>角色</label><select><option selected>车辆主管</option><option>系统管理员</option></select></div>
          <div class="cfg-row"><label>绑定模块</label><select><option selected>车辆档案</option></select></div>
          <div class="cfg-row"><label>条件字段</label><select><option>车辆状态</option><option>年检到期</option></select></div>
          <div class="cfg-row"><label>运算符</label><select><option>等于</option><option>不等于</option></select></div>
          <div class="cfg-row"><label>值</label><select><option>停用</option><option>报废</option></select></div>
          <p style="font-size:12px;color:var(--muted);margin-top:12px">条件节点可引用本模块字段 · 字典项 · 成员/部门</p>
        </aside>
      </div>
    </main>
  </div>
  <script src="../assets/app.js"></script>
</body>
</html>
