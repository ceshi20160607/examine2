<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>成员管理 · unexamine</title>
  <link rel="stylesheet" href="../assets/app.css">
  <style>
    .modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.4);display:flex;align-items:center;justify-content:center;z-index:50}
    .modal{background:var(--surface);border-radius:8px;width:480px;max-width:92vw;box-shadow:var(--elev-raised)}
    .modal-head{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
    .modal-body{padding:16px}
    .modal-foot{padding:12px 16px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
    .cfg-row{display:grid;grid-template-columns:80px 1fr;gap:8px;align-items:center;margin-bottom:10px;font-size:13px}
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="../index.html">unexamine</a>
      <select class="context-switch"><option>车系统</option></select>
      <nav class="top-tabs"><a href="../system/dashboard-admin.html">仪表盘</a><a href="../system/admin-home.html">系统后台</a></nav>
      <div class="top-actions"><span class="avatar">陈</span></div>
    </header>
    <aside class="sidebar"><div class="side-title">系统后台</div><nav class="nav"><a class="active" href="admin-users.html">成员管理</a><a href="admin-roles.html">角色权限</a></nav></aside>
    <main class="main">
      <div class="page-head">
        <div class="page-title"><h1>成员管理</h1><p>成员来自平台用户 · 弹窗 M-ADD-MEMBER（page-inventory §3）</p></div>
        <button class="btn primary">邀请成员</button>
      </div>
      <section class="panel table-wrap">
        <table class="table">
          <thead><tr><th>姓名</th><th>账号</th><th>部门</th><th>系统角色</th><th>状态</th><th>最近登录</th><th>操作</th></tr></thead>
          <tbody>
            <tr><td>陈和管理员</td><td>plat_admin</td><td>总部</td><td>系统管理员</td><td><span class="status ok"><span class="dot"></span>启用</span></td><td class="mono">2026-06-17 09:00</td><td><button class="btn weak">编辑</button></td></tr>
            <tr><td>陈和</td><td>chenhe</td><td>车队一部</td><td>普通成员</td><td><span class="status ok"><span class="dot"></span>启用</span></td><td class="mono">2026-06-16 14:20</td><td><button class="btn weak">编辑</button></td></tr>
            <tr><td>张伟</td><td>zhangwei</td><td>车队一部</td><td>车辆主管</td><td><span class="status ok"><span class="dot"></span>启用</span></td><td class="mono">2026-06-17 08:15</td><td><button class="btn weak">编辑</button></td></tr>
            <tr><td>李娜</td><td>lina</td><td>车队二部</td><td>维保专员</td><td><span class="status ok"><span class="dot"></span>启用</span></td><td class="mono">2026-06-15 16:40</td><td><button class="btn weak">编辑</button></td></tr>
          </tbody>
        </table>
      </section>
    </main>
  </div>
  <div class="modal-backdrop" aria-label="邀请成员 M-ADD-MEMBER">
    <div class="modal">
      <div class="modal-head"><strong>邀请成员</strong><button class="btn weak">×</button></div>
      <div class="modal-body">
        <div class="cfg-row"><label>搜索用户</label><input placeholder="输入平台账号或姓名，如 chenhe"></div>
        <div class="cfg-row"><label>选中用户</label><span>陈和 (chenhe)</span></div>
        <div class="cfg-row"><label>部门</label><select><option>车队一部</option><option>车队二部</option></select></div>
        <div class="cfg-row"><label>系统角色</label><select><option selected>普通成员</option><option>车辆主管</option></select></div>
      </div>
      <div class="modal-foot"><button class="btn">取消</button><button class="btn primary">确认添加</button></div>
    </div>
  </div>
  <script src="../assets/app.js"></script>
</body>
</html>
