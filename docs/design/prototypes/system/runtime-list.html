<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>车辆档案 · 车系统</title>
  <link rel="stylesheet" href="../css/app.css" />
</head>
<body>
  <div class="runtime-shell">
    <header class="runtime-topbar">
      <span class="runtime-brand">车系统</span>
      <nav class="runtime-group-nav" aria-label="模块组">
        <button type="button" class="active" data-module-group="vehicle">车辆管理</button>
      </nav>
      <div class="app-topbar-right">
        <button type="button" class="btn-icon" aria-label="待办">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
          <span class="badge-dot" aria-hidden="true"></span>
        </button>
        <button type="button" class="btn-icon" aria-label="消息">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
        </button>
        <span style="font-size: var(--text-sm); color: var(--muted);">陈和 · che</span>
      </div>
    </header>

    <div class="runtime-body">
      <aside class="runtime-sidebar" data-sidebar-group="vehicle" aria-label="模块">
        <a href="runtime-list.html" class="active">车辆档案</a>
        <a href="runtime-list.html">维保记录</a>
        <a href="runtime-list.html">驾驶员</a>
      </aside>

      <main class="runtime-content">
        <div class="page-header">
          <h1>车辆档案</h1>
          <p>管理车辆基本信息、状态与归属驾驶员</p>
        </div>

        <div class="card" data-table>
          <div class="toolbar">
            <div class="toolbar-left">
              <div class="search-input">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
                <input type="search" data-table-search placeholder="搜索车牌号、品牌型号…" aria-label="搜索" />
              </div>
              <select class="filter-select" data-table-filter aria-label="状态筛选">
                <option value="all">全部状态</option>
                <option value="active">在用</option>
                <option value="maintain">维保中</option>
                <option value="idle">闲置</option>
              </select>
              <select class="filter-select" data-table-sort aria-label="排序">
                <option value="plate">按车牌号</option>
                <option value="model">按品牌型号</option>
                <option value="date">按购置日期</option>
              </select>
            </div>
            <div class="toolbar-right">
              <a href="runtime-form.html" class="btn btn-primary">新建</a>
              <button type="button" class="btn btn-secondary" data-export>导出</button>
            </div>
          </div>

          <table class="data-table">
            <thead>
              <tr>
                <th>车牌号</th>
                <th>品牌型号</th>
                <th>购置日期</th>
                <th>驾驶员</th>
                <th>状态</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody>
              <tr data-status="active" data-sort-plate="京A·12345" data-sort-model="丰田凯美瑞" data-sort-date="2022-03-15">
                <td><strong>京A·12345</strong></td>
                <td>丰田凯美瑞</td>
                <td class="num">2022-03-15</td>
                <td>张伟</td>
                <td><span class="badge badge-success">在用</span></td>
                <td>
                  <button type="button" class="btn btn-ghost btn-sm" data-open-modal="vehicle-modal" data-vehicle="京A·12345">查看</button>
                </td>
              </tr>
              <tr data-status="maintain" data-sort-plate="京B·67890" data-sort-model="大众帕萨特" data-sort-date="2021-08-20">
                <td><strong>京B·67890</strong></td>
                <td>大众帕萨特</td>
                <td class="num">2021-08-20</td>
                <td>李娜</td>
                <td><span class="badge badge-warn">维保中</span></td>
                <td>
                  <button type="button" class="btn btn-ghost btn-sm" data-open-modal="vehicle-modal" data-vehicle="京B·67890">查看</button>
                </td>
              </tr>
              <tr data-status="active" data-sort-plate="京C·11223" data-sort-model="本田雅阁" data-sort-date="2023-01-10">
                <td><strong>京C·11223</strong></td>
                <td>本田雅阁</td>
                <td class="num">2023-01-10</td>
                <td>王强</td>
                <td><span class="badge badge-success">在用</span></td>
                <td>
                  <button type="button" class="btn btn-ghost btn-sm" data-open-modal="vehicle-modal" data-vehicle="京C·11223">查看</button>
                </td>
              </tr>
              <tr data-status="idle" data-sort-plate="京D·44556" data-sort-model="别克GL8" data-sort-date="2020-11-05">
                <td><strong>京D·44556</strong></td>
                <td>别克GL8</td>
                <td class="num">2020-11-05</td>
                <td>—</td>
                <td><span class="badge badge-muted">闲置</span></td>
                <td>
                  <button type="button" class="btn btn-ghost btn-sm" data-open-modal="vehicle-modal" data-vehicle="京D·44556">查看</button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </main>
    </div>
  </div>

  <div class="modal-overlay" id="vehicle-modal" role="dialog" aria-modal="true" aria-labelledby="vehicle-modal-title">
    <div class="modal">
      <div class="modal-header">
        <h3 id="vehicle-modal-title">车辆详情</h3>
        <button type="button" class="btn btn-ghost btn-sm" data-close-modal aria-label="关闭"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
      </div>
      <div class="modal-body">
        <dl style="display: grid; grid-template-columns: auto 1fr; gap: var(--space-2) var(--space-4); font-size: var(--text-sm);">
          <dt style="color: var(--muted);">车牌号</dt>
          <dd id="modal-plate">京A·12345</dd>
          <dt style="color: var(--muted);">品牌型号</dt>
          <dd id="modal-model">丰田凯美瑞</dd>
          <dt style="color: var(--muted);">购置日期</dt>
          <dd id="modal-date" class="num">2022-03-15</dd>
          <dt style="color: var(--muted);">驾驶员</dt>
          <dd id="modal-driver">张伟</dd>
          <dt style="color: var(--muted);">状态</dt>
          <dd id="modal-status"><span class="badge badge-success">在用</span></dd>
        </dl>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-close-modal>关闭</button>
      </div>
    </div>
  </div>

  <script src="../js/app.js"></script>
  <script>
    (function () {
      var modalData = {
        '京A·12345': { model: '丰田凯美瑞', date: '2022-03-15', driver: '张伟', status: '在用', badge: 'badge-success' },
        '京B·67890': { model: '大众帕萨特', date: '2021-08-20', driver: '李娜', status: '维保中', badge: 'badge-warn' },
        '京C·11223': { model: '本田雅阁', date: '2023-01-10', driver: '王强', status: '在用', badge: 'badge-success' },
        '京D·44556': { model: '别克GL8', date: '2020-11-05', driver: '—', status: '闲置', badge: 'badge-muted' }
      };
      document.querySelectorAll('[data-open-modal="vehicle-modal"]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var plate = btn.getAttribute('data-vehicle');
          var d = modalData[plate];
          if (!d) return;
          document.getElementById('modal-plate').textContent = plate;
          document.getElementById('modal-model').textContent = d.model;
          document.getElementById('modal-date').textContent = d.date;
          document.getElementById('modal-driver').textContent = d.driver;
          document.getElementById('modal-status').innerHTML = '<span class="badge ' + d.badge + '">' + d.status + '</span>';
        });
      });
    })();
  </script>
</body>
</html>
