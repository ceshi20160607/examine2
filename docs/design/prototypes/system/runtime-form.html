<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>新建车辆 · 车系统</title>
  <link rel="stylesheet" href="../css/app.css" />
</head>
<body>
  <div class="runtime-shell">
    <header class="runtime-topbar">
      <span class="runtime-brand">车系统</span>
      <nav class="runtime-group-nav" aria-label="模块组">
        <button type="button" class="active" data-module-group="vehicle">车辆管理</button>
      </nav>
      <div class="app-topbar-right">
        <button type="button" class="btn-icon" aria-label="待办">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
          <span class="badge-dot" aria-hidden="true"></span>
        </button>
        <button type="button" class="btn-icon" aria-label="消息">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
        </button>
        <span style="font-size: var(--text-sm); color: var(--muted);">陈和 · che</span>
      </div>
    </header>

    <div class="runtime-body">
      <aside class="runtime-sidebar" data-sidebar-group="vehicle" aria-label="模块">
        <a href="runtime-list.html" class="active">车辆档案</a>
        <a href="runtime-maintenance.html">维保记录</a>
        <a href="runtime-driver.html">驾驶员</a>
      </aside>

      <main class="runtime-content">
        <div class="page-header">
          <h1>新建车辆</h1>
          <p>填写车辆基本信息并保存至车辆档案</p>
        </div>

        <div class="card" style="max-width: 560px;">
          <form data-validate-form data-success="车辆已创建" data-redirect="runtime-list.html">
            <div class="field">
              <label for="plate">车牌号</label>
              <input type="text" id="plate" name="plate" placeholder="例如 京A·12345" required />
              <span class="field-error">请输入车牌号</span>
            </div>

            <div class="field">
              <label for="model">品牌型号</label>
              <input type="text" id="model" name="model" placeholder="例如 丰田凯美瑞" required />
              <span class="field-error">请输入品牌型号</span>
            </div>

            <div class="field">
              <label for="purchase-date">购置日期</label>
              <input type="date" id="purchase-date" name="purchase-date" required />
              <span class="field-error">请选择购置日期</span>
            </div>

            <div class="field">
              <label for="status">状态</label>
              <select id="status" name="status" required>
                <option value="">请选择状态</option>
                <option value="active">在用</option>
                <option value="maintain">维保中</option>
                <option value="idle">闲置</option>
              </select>
              <span class="field-error">请选择状态</span>
            </div>

            <div class="field">
              <label for="driver">驾驶员</label>
              <select id="driver" name="driver">
                <option value="">未分配</option>
                <option value="zhangwei">张伟</option>
                <option value="lina">李娜</option>
                <option value="wangqiang">王强</option>
              </select>
              <span class="field-help">可从驾驶员模块中选择已登记人员</span>
            </div>

            <div style="display: flex; gap: var(--space-2); margin-top: var(--space-2);">
              <button type="submit" class="btn btn-primary">保存</button>
              <a href="runtime-list.html" class="btn btn-secondary">取消</a>
            </div>
          </form>
        </div>
      </main>
    </div>
  </div>

  <script src="../js/app.js"></script>
</body>
</html>
