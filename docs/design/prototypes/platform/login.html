<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · unexamine</title>
  <link rel="stylesheet" href="../assets/app.css">
</head>
<body>
  <main class="auth-shell" data-od-id="login">
    <section class="auth-panel">
      <a class="auth-brand" href="../index.html">unexamine</a>
      <h1 class="auth-title">登录平台</h1>
      <p class="auth-copy">账号登录后再进入平台工作台、系统运行态或有权限的后台。</p>
      <form class="auth-form">
        <label class="auth-field">
          <span>账号</span>
          <input class="input" value="che" autocomplete="username">
        </label>
        <label class="auth-field">
          <span>密码</span>
          <input class="input" type="password" value="123456" autocomplete="current-password">
        </label>
        <div class="auth-actions">
          <a class="muted" href="register.html">注册并创建系统</a>
          <a class="btn primary" href="my-systems.html">登录</a>
        </div>
      </form>
    </section>
    <aside class="auth-side">
      <div class="panel pad">
        <h2 style="font-size:18px;margin:0 0 12px">登录前不展示业务导航</h2>
        <p class="muted" style="margin:0 0 16px">待办、消息、系统切换、平台后台入口都依赖登录态和权限判断。</p>
        <div class="list-card">
          <div class="list-row">普通成员 <span>进入车系统运行态</span></div>
          <div class="list-row">系统管理员 <span>可见系统后台入口</span></div>
          <div class="list-row">平台管理员 <span>可见平台后台入口</span></div>
        </div>
      </div>
    </aside>
  </main>
</body>
</html>
