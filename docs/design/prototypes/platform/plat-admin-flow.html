<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>平台 Flow 配置 · unexamine</title>
  <link rel="stylesheet" href="../assets/app.css">
  <style>
    .flow-workspace{display:grid;grid-template-columns:200px minmax(0,1fr)280px;gap:0;border:1px solid var(--border);border-radius:8px;overflow:hidden;min-height:520px;background:var(--surface)}
    .flow-palette{border-right:1px solid var(--border);background:#fafbfc;padding:12px}
    .flow-palette h3{margin:0 0 10px;font-size:12px;color:var(--muted)}
    .flow-node-type{display:block;padding:8px 10px;margin-bottom:6px;border:1px solid var(--border);border-radius:6px;font-size:13px;background:var(--surface)}
    .flow-canvas-wrap{position:relative;background:#f5f7fa;min-height:480px;border-right:1px solid var(--border)}
    .flow-props{padding:14px;background:var(--surface);overflow:auto}
    .flow-props h3{margin:0 0 12px;font-size:14px}
    .cfg-row{display:grid;grid-template-columns:80px minmax(0,1fr);gap:8px;align-items:center;margin-bottom:10px;font-size:13px}
    .cfg-row label{color:var(--muted)}
    .cfg-row input,.cfg-row select{width:100%;border:1px solid var(--border);border-radius:6px;padding:6px 8px}
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar"><a class="brand" href="../index.html">unexamine</a><select class="context-switch"><option>平台工作台</option></select><nav class="top-tabs"><a href="../platform/plat-admin-overview.html">平台后台</a></nav><div class="top-actions"><span class="avatar">陈</span></div></header>
    <aside class="sidebar"><div class="side-title">平台后台</div><nav class="nav"><a class="active" href="plat-admin-flow.html">平台 Flow</a><a href="plat-admin-apps.html">平台应用</a></nav></aside>
    <main class="main">
      <div class="page-head">
        <div class="page-title"><h1>平台 Flow 配置</h1><p>三栏 · 可被平台应用授权开放（RES-005）</p></div>
        <button class="btn primary">保存并发布</button>
      </div>
      <div class="flow-workspace">
        <aside class="flow-palette">
          <h3>节点面板</h3>
          <span class="flow-node-type">审批节点</span>
          <span class="flow-node-type">条件节点</span>
          <span class="flow-node-type">抄送节点</span>
          <span class="flow-node-type">外部 API</span>
        </aside>
        <section class="flow-canvas-wrap canvas">
          <div class="node" style="left:40px;top:48px"><strong>触发</strong>平台应用调用</div>
          <div class="node" style="left:220px;top:120px;border-color:var(--accent)"><strong>审批</strong>平台管理员</div>
          <div class="node" style="left:400px;top:200px"><strong>结束</strong>回调通知</div>
        </section>
        <aside class="flow-props">
          <h3>节点属性 · 审批</h3>
          <div class="cfg-row"><label>节点名称</label><input value="平台管理员审批"></div>
          <div class="cfg-row"><label>审批人</label><select><option selected>平台管理员角色</option></select></div>
          <div class="cfg-row"><label>开放范围</label><select><option>车系统数据开放应用</option></select></div>
          <div class="cfg-row"><label>超时</label><input value="72 小时"></div>
        </aside>
      </div>
    </main>
  </div>
  <script src="../assets/app.js"></script>
</body>
</html>
