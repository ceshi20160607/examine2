<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>注册 · unexamine</title>
  <link rel="stylesheet" href="../css/app.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <h1>创建账号</h1>
      <p class="subtitle">注册并创建您的第一个业务系统</p>
      <form data-validate-form data-redirect="login.html" data-success="注册成功，请登录">
        <div class="field">
          <label for="account">账号（邮箱）</label>
          <input type="email" id="account" name="account" placeholder="name@company.com" required autocomplete="email" />
          <span class="field-error">请输入有效的邮箱地址</span>
        </div>
        <div class="field">
          <label for="password">密码</label>
          <input type="password" id="password" name="password" placeholder="至少 6 位字符" required minlength="6" autocomplete="new-password" />
          <span class="field-error">请输入至少 6 位密码</span>
        </div>
        <div class="field">
          <label for="system-name">系统名称</label>
          <input type="text" id="system-name" name="system-name" placeholder="例如：车系统" required />
          <span class="field-help">将为您自动创建首个业务系统</span>
          <span class="field-error">请输入系统名称</span>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: var(--space-2);">注册</button>
      </form>
      <p style="margin-top: var(--space-5); text-align: center; font-size: var(--text-sm); color: var(--muted);">
        已有账号？<a href="login.html" style="color: var(--accent);">返回登录</a>
      </p>
    </div>
  </div>
  <script src="../js/app.js"></script>
</body>
</html>
