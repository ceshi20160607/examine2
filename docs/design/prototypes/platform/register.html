<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>注册并创建系统 · unexamine</title>
  <link rel="stylesheet" href="../assets/app.css">
</head>
<body>
  <main class="auth-shell" data-od-id="register">
    <section class="auth-panel">
      <a class="auth-brand" href="../index.html">unexamine</a>
      <h1 class="auth-title">注册并创建系统</h1>
      <p class="auth-copy">注册人会成为新系统管理员，创建后再进入系统后台配置。</p>
      <form class="auth-form">
        <label class="auth-field">
          <span>姓名</span>
          <input class="input" value="平台管理员">
        </label>
        <label class="auth-field">
          <span>登录账号</span>
          <input class="input" value="admin@example.com">
        </label>
        <label class="auth-field">
          <span>系统名称</span>
          <input class="input" value="车系统">
        </label>
        <label class="auth-field">
          <span>首个模块组</span>
          <input class="input" value="车辆管理">
        </label>
        <div class="auth-actions">
          <a class="muted" href="login.html">已有账号，去登录</a>
          <a class="btn primary" href="../system/admin-home.html">创建并进入配置引导</a>
        </div>
      </form>
    </section>
    <aside class="auth-side">
      <div class="panel pad">
        <h2 style="font-size:18px;margin:0 0 12px">创建后的默认权限</h2>
        <div class="list-card">
          <div class="list-row">系统角色 <span>系统管理员</span></div>
          <div class="list-row">默认模块组 <span>车辆管理</span></div>
          <div class="list-row">后续成员 <span>从平台用户中邀请</span></div>
        </div>
        <p class="muted" style="margin:16px 0 0">注册页本身保持登录前状态，不出现平台侧栏和运行态菜单。</p>
      </div>
    </aside>
  </main>
</body>
</html>
