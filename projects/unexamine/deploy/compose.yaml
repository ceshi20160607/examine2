# @generated by Template Base. Local development dependencies only.
name: unexamine
services:
  mysql:
    image: mysql:8.4
    command: ["--log-bin-trust-function-creators=1"]
    environment:
      TZ: Asia/Shanghai
      MYSQL_DATABASE: unexamine
      MYSQL_USER: unexamine
      MYSQL_PASSWORD: unexamine_local
      MYSQL_ROOT_PASSWORD: unexamine_root_local
    ports: ["33077:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-punexamine_root_local"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes: ["mysql-data:/var/lib/mysql"]
  redis:
    image: redis:7.4-alpine
    ports: ["36379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  mysql-data:
