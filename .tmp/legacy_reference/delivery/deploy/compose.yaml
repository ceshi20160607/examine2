name: examine2

services:
  mysql:
    image: mysql:8.4.10
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${EXAMINE_DB_NAME}
      MYSQL_USER: ${EXAMINE_DB_USERNAME}
      MYSQL_PASSWORD: ${EXAMINE_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${EXAMINE_DB_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -uroot --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${EXAMINE_REDIS_PASSWORD}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${EXAMINE_REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    image: eclipse-temurin:21-jre-jammy
    restart: unless-stopped
    working_dir: /opt/examine
    command:
      - java
      - -jar
      - /opt/examine/package/backend/examine-web.jar
      - --spring.flyway.locations=filesystem:/opt/examine/package/sql/migration
    env_file:
      - .env
    environment:
      EXAMINE_DB_URL: jdbc:mysql://mysql:3306/${EXAMINE_DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      EXAMINE_DB_USERNAME: ${EXAMINE_DB_USERNAME}
      EXAMINE_DB_PASSWORD: ${EXAMINE_DB_PASSWORD}
      EXAMINE_REDIS_HOST: redis
      EXAMINE_REDIS_PORT: 6379
      EXAMINE_REDIS_PASSWORD: ${EXAMINE_REDIS_PASSWORD}
      EXAMINE_SERVER_PORT: 8080
      EXAMINE_FILE_LOCAL_ROOT: /opt/examine/data/files
      EXAMINE_FLYWAY_LOCATIONS: filesystem:/opt/examine/package/sql/migration
      LOGGING_FILE_NAME: /opt/examine/logs/examine2.log
    volumes:
      - ${EXAMINE_ARTIFACT_ROOT:-..}:/opt/examine/package:ro
      - "${EXAMINE_DATA_ROOT}/files:/opt/examine/data/files"
      - "${EXAMINE_DATA_ROOT}/logs:/opt/examine/logs"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${EXAMINE_BACKEND_BIND:-127.0.0.1}:${EXAMINE_BACKEND_PORT:-8080}:8080"

  frontend:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ${EXAMINE_ARTIFACT_ROOT:-..}/frontend:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    ports:
      - "${EXAMINE_WEB_BIND:-127.0.0.1}:${EXAMINE_WEB_PORT:-8088}:80"

volumes:
  mysql-data:
  redis-data:
