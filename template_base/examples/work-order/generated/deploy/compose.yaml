# @generated by Template Base. Local verification dependencies only.
name: work-order-sample
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: template_base
      MYSQL_USER: template_base
      MYSQL_PASSWORD: template_base
      MYSQL_ROOT_PASSWORD: template_base_root
    ports: ["33077:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ptemplate_base_root"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.4-alpine
    ports: ["36379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
